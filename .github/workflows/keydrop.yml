name: Gui key Telegram

on:
  schedule:
    - cron: "0 5 * * *"
      timezone: "Asia/Ho_Chi_Minh"
    - cron: "0 10 * * *"
      timezone: "Asia/Ho_Chi_Minh"
    - cron: "0 15 * * *"
      timezone: "Asia/Ho_Chi_Minh"
    - cron: "0 20 * * *"
      timezone: "Asia/Ho_Chi_Minh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: send-key
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Tao key 1h va gui group
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.8841904683:AAFDQmAuhcoWv26p_5TC_tQV9zhdaXbNoCk }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_URL: https://efhqbzdnrtifqjqlqseb.supabase.co
          TELEGRAM_CHAT_ID: "-1004446959502"
        run: python bot.py --once